# Reference copy of the robotd.toml installed on the RK3588 at /home/linaro/microduck-board/
# (from work/g3-offline/microduck-board/, 2026-10-07). The board reads its own copy, checked
# by SHA256SUMS there; editing this file changes nothing on the board.
# RK3588 runtime configuration: same parameters as the Mac rehearsal; board-local model paths.
[control]
hz = 50

[policy]
enabled = true
mode = "walk"
walk = "/home/linaro/microduck-board/policies/walk_17500.onnx"
stand = "/home/linaro/microduck-board/policies/velstand.onnx"
sitstand = "none"
ground_pick = "none"
kick_left = "none"
kick_right = "none"
roulade = "none"

# Match the unfiltered action output used in the successful policy replay.
action_scale = 1.0
standing_action_scale = 1.0
standing_gain_ratio = 1.0
gain = 200
head_lowpass = 1.0
legs_lowpass = 1.0
voltage_adapt = false

[audio]
enabled = false
