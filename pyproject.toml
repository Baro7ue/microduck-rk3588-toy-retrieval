[project]
name = "microduck-toy"
version = "0.1.0"
description = "MicroDuck sim twin + RK3588 board: vision, robotd client and control for toy retrieval"
requires-python = ">=3.10"
# Runtime packages come from third_party/microduck_rl/.venv on the Mac (numpy, onnxruntime, mujoco)
# plus offline/vision-export/site-packages (opencv), and from the board venv on the RK3588.
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
